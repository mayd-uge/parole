<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone.png">
<title>Parole</title>
<style>
/* ============================================================
   PAROLE — interface de communication
   Tout tient dans ce seul fichier. Aucune connexion requise.
   Pour modifier les phrases : voir le bloc PHRASES plus bas.
   ============================================================ */

:root{
  --paper:#F1F3F2;
  --card:#FFFFFF;
  --ink:#16211D;
  --ink-soft:#5C6B65;
  --line:#D5DCD9;
  --accent:#1F6F5C;
  --accent-ink:#FFFFFF;
  --focus:#0B5FBF;
  --radius:14px;
  --tap:76px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:20px;
  line-height:1.35;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- Bandeau de lecture (l'interlocuteur lit) ---------- */
#ecran{
  flex:0 0 auto;
  min-height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 20px;
  background:var(--ink);
  color:#F3F7F5;
  text-align:center;
  font-size:clamp(26px,4.4vw,44px);
  font-weight:600;
  letter-spacing:-0.01em;
}
#ecran.vide{color:#8FA39C;font-weight:400;font-size:20px;letter-spacing:0}
#ecran.parle{background:var(--accent)}

/* ---------- Catégories ---------- */
#rail{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  padding:10px 12px;
  overflow-x:auto;
  background:var(--card);
  border-bottom:1px solid var(--line);
  -webkit-overflow-scrolling:touch;
}
#rail button{
  flex:0 0 auto;
  padding:14px 22px;
  border-radius:999px;
  background:var(--paper);
  border:1px solid var(--line);
  font-weight:600;
  white-space:nowrap;
  min-height:56px;
}
#rail button[aria-selected="true"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}

/* ---------- Grille de phrases ---------- */
#grille{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:10px;
  padding:12px;
  align-content:start;
}
.phrase{
  min-height:var(--tap);
  padding:16px 18px;
  background:var(--card);
  border:1px solid var(--line);
  border-left:6px solid var(--accent);
  border-radius:var(--radius);
  text-align:left;
  font-size:21px;
  display:flex;
  align-items:center;
}
.phrase:active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vide-msg{grid-column:1/-1;padding:28px 6px;color:var(--ink-soft)}

/* ---------- Barre du bas ---------- */
#barre{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--card);
  border-top:1px solid var(--line);
  align-items:center;
}
#saisie{
  flex:1 1 auto;
  min-height:64px;
  padding:12px 16px;
  font:inherit;
  font-size:21px;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
#barre button{
  flex:0 0 auto;
  min-height:64px;
  padding:0 20px;
  border-radius:var(--radius);
  font-weight:600;
  background:var(--paper);
  border:1px solid var(--line);
}
#dire{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:0 28px}
#stop{color:#8A2B2B}

/* ---------- Réglages ---------- */
#reglages{
  position:fixed;inset:0;
  background:rgba(10,20,17,.55);
  display:none;
  align-items:center;justify-content:center;
  padding:20px;
  z-index:10;
}
#reglages.ouvert{display:flex}
#panneau{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  width:min(560px,100%);
  max-height:86vh;
  overflow-y:auto;
}
#panneau h2{margin:0 0 18px;font-size:24px}
.champ{margin-bottom:20px}
.champ label{display:block;margin-bottom:8px;font-weight:600}
.champ select,.champ input[type=range]{width:100%;font:inherit;font-size:19px}
.champ select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.aide{color:var(--ink-soft);font-size:16px;margin-top:6px}
#fermer{width:100%;min-height:60px;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);font-weight:600;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="ecran" class="vide">Touchez une phrase pour la faire dire</div>
<nav id="rail" role="tablist" aria-label="Catégories"></nav>
<main id="grille" role="tabpanel" aria-label="Phrases"></main>

<div id="barre">
  <input id="saisie" type="text" placeholder="Écrire une phrase…" autocomplete="off" autocorrect="on" enterkeyhint="send">
  <button id="dire">Dire</button>
  <button id="stop" aria-label="Arrêter la voix">Stop</button>
  <button id="ouvrir" aria-label="Réglages">Réglages</button>
</div>

<div id="reglages" role="dialog" aria-modal="true" aria-labelledby="titre-reglages">
  <div id="panneau">
    <h2 id="titre-reglages">Réglages</h2>
    <div class="champ">
      <label for="voix">Voix</label>
      <select id="voix"></select>
      <p class="aide">Pour ajouter des voix : Réglages de l'iPad, Accessibilité, Contenu énoncé, Voix.</p>
    </div>
    <div class="champ">
      <label for="vitesse">Vitesse — <span id="vitesse-val">normale</span></label>
      <input id="vitesse" type="range" min="0.5" max="1.3" step="0.05" value="0.95">
    </div>
    <div class="champ">
      <label for="taille">Taille des boutons — <span id="taille-val">moyenne</span></label>
      <input id="taille" type="range" min="200" max="420" step="20" value="230">
    </div>
    <button id="fermer">Fermer</button>
  </div>
</div>

<script>
/* ============================================================
   PHRASES — c'est ici, et seulement ici, qu'on modifie le contenu.
   Une catégorie = un titre entre guillemets, puis ses phrases.
   Ajouter, supprimer, réécrire librement. Garder les virgules.
   ============================================================ */
const PHRASES = {
  "Essentiel": [
    "Oui.",
    "Non.",
    "S'il te plaît.",
    "Merci beaucoup.",
    "Attends un instant, j'écris.",
    "J'ai besoin d'aide.",
    "Peux-tu venir, s'il te plaît ?",
    "Ce n'est pas ce que je voulais dire.",
    "J'ai soif.",
    "J'ai faim.",
    "Je voudrais aller aux toilettes.",
    "J'ai fini."
  ],
  "Confort": [
    "Peux-tu me remonter dans le fauteuil ?",
    "Je suis mal installé.",
    "Peux-tu bouger mon bras ?",
    "J'ai froid.",
    "J'ai chaud.",
    "Peux-tu ouvrir la fenêtre ?",
    "Peux-tu fermer la fenêtre ?",
    "Trop de lumière.",
    "Peux-tu baisser le son ?",
    "Je voudrais me reposer.",
    "Je voudrais me lever.",
    "Je suis bien comme ça."
  ],
  "Santé": [
    "J'ai mal ici.",
    "C'est la douleur habituelle.",
    "C'est nouveau, ça m'inquiète.",
    "J'ai du mal à respirer.",
    "J'ai avalé de travers.",
    "Je me sens fatigué.",
    "Ça va mieux maintenant.",
    "Peux-tu appeler le médecin ?",
    "Ce n'est pas urgent.",
    "Ne t'inquiète pas."
  ],
  "Échanges": [
    "Bonjour, content de te voir.",
    "Comment vas-tu ?",
    "Raconte-moi.",
    "Ça m'intéresse, continue.",
    "Je n'ai pas bien entendu.",
    "Peux-tu répéter, plus lentement ?",
    "Laisse-moi le temps de répondre.",
    "Parle-moi normalement, je comprends tout.",
    "Assieds-toi, on a le temps.",
    "Merci d'être passé.",
    "À bientôt.",
    "Embrasse tout le monde pour moi."
  ],
  "Réponses": [
    "Bonne idée.",
    "Je ne suis pas d'accord.",
    "Peut-être.",
    "Je ne sais pas.",
    "Ça m'est égal.",
    "Plus tard.",
    "Tout à fait.",
    "Absolument pas.",
    "Je réfléchis.",
    "On en reparle."
  ],
  "Humour": [
    "Je suis muet, pas sourd.",
    "Ne me fais pas rire, j'écris.",
    "J'ai des choses à dire, prends une chaise.",
    "Mon silence est une opinion.",
    "Répète, pour voir si tu oses.",
    "La machine est d'accord avec moi.",
    "Patience, je tape à la vitesse de la pensée.",
    "C'est moi qui ai le dernier mot."
  ]
};

/* ============================================================
   Mécanique — rien à modifier en dessous de cette ligne.
   ============================================================ */
const synth = window.speechSynthesis;
const ecran = document.getElementById('ecran');
const rail = document.getElementById('rail');
const grille = document.getElementById('grille');
const saisie = document.getElementById('saisie');
const selVoix = document.getElementById('voix');
const rVitesse = document.getElementById('vitesse');
const rTaille = document.getElementById('taille');

let voixDispo = [];
let recentes = [];
let categorieActive = Object.keys(PHRASES)[0];

/* --- Voix --- */
function chargerVoix(){
  voixDispo = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  if(!voixDispo.length) voixDispo = synth.getVoices();
  selVoix.innerHTML = '';
  voixDispo.forEach((v,i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = v.name + (v.lang ? ' — ' + v.lang : '');
    selVoix.appendChild(o);
  });
}
chargerVoix();
if(typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = chargerVoix;

/* --- Parler --- */
function parler(texte){
  if(!texte || !texte.trim()) return;
  texte = texte.trim();
  synth.cancel();
  const u = new SpeechSynthesisUtterance(texte);
  const v = voixDispo[selVoix.value];
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'fr-FR'; }
  u.rate = parseFloat(rVitesse.value);
  u.onstart = () => ecran.classList.add('parle');
  u.onend = () => ecran.classList.remove('parle');
  u.onerror = () => ecran.classList.remove('parle');
  ecran.textContent = texte;
  ecran.classList.remove('vide');
  synth.speak(u);
  memoriser(texte);
}

function memoriser(texte){
  recentes = [texte, ...recentes.filter(t => t !== texte)].slice(0,14);
  if(categorieActive === 'Récent') afficher('Récent');
}

/* --- Affichage --- */
function construireRail(){
  const noms = ['Récent', ...Object.keys(PHRASES)];
  noms.forEach(nom => {
    const b = document.createElement('button');
    b.textContent = nom;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', nom === categorieActive ? 'true' : 'false');
    b.addEventListener('click', () => {
      categorieActive = nom;
      [...rail.children].forEach(c => c.setAttribute('aria-selected', c === b ? 'true' : 'false'));
      afficher(nom);
    });
    rail.appendChild(b);
  });
}

function afficher(nom){
  const liste = nom === 'Récent' ? recentes : (PHRASES[nom] || []);
  grille.innerHTML = '';
  grille.scrollTop = 0;
  if(!liste.length){
    const p = document.createElement('p');
    p.className = 'vide-msg';
    p.textContent = 'Les phrases dites récemment apparaîtront ici.';
    grille.appendChild(p);
    return;
  }
  liste.forEach(txt => {
    const b = document.createElement('button');
    b.className = 'phrase';
    b.textContent = txt;
    b.addEventListener('click', () => parler(txt));
    grille.appendChild(b);
  });
}

/* --- Saisie libre --- */
document.getElementById('dire').addEventListener('click', () => {
  if(saisie.value.trim()){ parler(saisie.value); saisie.value = ''; }
});
saisie.addEventListener('keydown', e => {
  if(e.key === 'Enter' && saisie.value.trim()){ parler(saisie.value); saisie.value = ''; }
});
document.getElementById('stop').addEventListener('click', () => {
  synth.cancel(); ecran.classList.remove('parle');
});

/* --- Réglages --- */
const modale = document.getElementById('reglages');
document.getElementById('ouvrir').addEventListener('click', () => modale.classList.add('ouvert'));
document.getElementById('fermer').addEventListener('click', () => modale.classList.remove('ouvert'));
modale.addEventListener('click', e => { if(e.target === modale) modale.classList.remove('ouvert'); });

rVitesse.addEventListener('input', () => {
  const v = parseFloat(rVitesse.value);
  document.getElementById('vitesse-val').textContent = v < 0.8 ? 'lente' : (v > 1.05 ? 'rapide' : 'normale');
});
rTaille.addEventListener('input', () => {
  const px = rTaille.value;
  grille.style.gridTemplateColumns = `repeat(auto-fill,minmax(${px}px,1fr))`;
  document.getElementById('taille-val').textContent = px < 260 ? 'moyenne' : (px < 350 ? 'grande' : 'très grande');
});

/* --- Démarrage --- */
construireRail();
afficher(categorieActive);

/* --- Fonctionnement hors ligne --- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
